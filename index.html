<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جراج علال - garageallal.co</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;400&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif}</style>
</head>
<body class="bg-[#0F0F0F] text-white">
<header class="bg-black border-b-2 border-yellow-400 p-4 sticky top-0 z-50">
<div class="max-w-6xl mx-auto flex justify-between items-center">
<h1 class="text-xl font-bold text-yellow-400">جراج علال درب غلف</h1>
<div class="flex gap-2"><span class="bg-green-500 text-xs px-2 py-1 rounded-full">متصل ✅</span><a href="https://wa.me/212600000000" class="bg-yellow-400 text-black px-3 py-1 rounded-full text-sm font-bold">واتساب</a></div>
</div>
</header>
<div class="max-w-6xl mx-auto p-4">
<div class="bg-zinc-900 rounded-2xl p-4 mb-4">
<input id="search" placeholder="🔍 قلب على آيفون، سامسونج، حاسوب..." class="w-full p-4 rounded-xl bg-black border border-zinc-700 text-white" oninput="filterProducts()">
<div class="flex gap-2 mt-3 overflow-auto">
<button onclick="filterCat('all')" class="bg-yellow-400 text-black px-4 py-2 rounded-full text-sm font-bold">الكل</button>
<button onclick="filterCat('phone')" class="bg-zinc-800 px-4 py-2 rounded-full text-sm">هواتف</button>
<button onclick="filterCat('pc')" class="bg-zinc-800 px-4 py-2 rounded-full text-sm">حواسيب</button>
<button onclick="filterCat('accessoire')" class="bg-zinc-800 px-4 py-2 rounded-full text-sm">اكسسوارات</button>
</div>
</div>
<div id="deals" class="bg-gradient-to-r from-yellow-400 to-orange-500 text-black rounded-2xl p-4 mb-4">
<h3 class="font-bold">🔥 هميزات اليوم</h3>
<p id="dealsText">محل أمين - تخفيض 500 DH على الايفونات</p>
</div>
<div id="products" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
</div>
<script>
const products = [
{id:1,name:"iPhone 13 128GB",price:"4500 DH",old:"5000 DH",img:"📱",merchant:"محل أمين",area:"طابق 1 - محل 45",vip:true,cat:"phone"},
{id:2,name:"Samsung S22 Ultra",price:"6000 DH",old:"7000 DH",img:"📱",merchant:"محل حمزة",area:"طابق 2 - محل 12",vip:false,cat:"phone"},
{id:3,name:"HP i5 8GB",price:"3200 DH",old:"3800 DH",img:"💻",merchant:"محل زكرياء",area:"طابق 1 - محل 18",vip:false,cat:"pc"},
{id:4,name:"AirPods Pro",price:"450 DH",old:"600 DH",img:"🎧",merchant:"محل أمين",area:"طابق 1 - محل 45",vip:true,cat:"accessoire"},
];
function render(list){
document.getElementById('products').innerHTML = list.map(p=>`
<div class="bg-zinc-900 rounded-2xl overflow-hidden border ${p.vip?'border-yellow-400':'border-zinc-800'}">
<div class="p-6 text-4xl text-center bg-black">${p.img}</div>
<div class="p-3">
<h3 class="font-bold text-sm">${p.name}</h3>
<p class="text-yellow-400 font-bold">${p.price} <span class="text-xs line-through text-gray-500">${p.old}</span></p>
<p class="text-xs text-gray-400 mt-1">🏬 ${p.merchant} ${p.vip?'⭐':''}</p>
<p class="text-xs text-gray-500">${p.area}</p>
<a href="https://wa.me/212661234567?text=بغيت ${p.name}" target="_blank" class="block mt-3 bg-green-500 text-center py-2 rounded-xl text-sm font-bold">واتساب</a>
</div>
</div>`).join('');
}
function filterProducts(){
const q=document.getElementById('search').value.toLowerCase();
render(products.filter(p=>p.name.toLowerCase().includes(q)));
}
function filterCat(c){
if(c==='all') render(products);
else render(products.filter(p=>p.cat===c));
}
render(products);
</script>
</body>
</html>
