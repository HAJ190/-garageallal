<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Garage Allal - admin.garageallal.co</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;400&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif}</style>
</head>
<body class="bg-[#0F0F0F] text-white">
<header class="bg-black border-b-2 border-red-500 p-4">
<div class="max-w-6xl mx-auto flex justify-between">
<h1 class="text-xl font-bold text-red-400">👑 لوحة تحكم جراج علال - ADMIN</h1>
<span class="text-xs bg-red-500 px-3 py-1 rounded-full">ADM999</span>
</div>
</header>
<div class="max-w-6xl mx-auto p-4 space-y-4">
<div id="login" class="bg-zinc-900 rounded-2xl p-6 max-w-sm mx-auto mt-10">
<h2 class="font-bold mb-4">دخول الأدمن</h2>
<input id="pin" type="password" placeholder="القن السري" class="w-full p-3 rounded-xl bg-black border border-zinc-700 mb-3">
<button onclick="login()" class="w-full bg-red-500 py-3 rounded-xl font-bold">دخول</button>
<p class="text-xs text-gray-500 mt-2">جرب: ADM999</p>
</div>
<div id="dashboard" class="hidden space-y-4">
<div class="grid grid-cols-3 gap-3">
<div class="bg-zinc-900 p-4 rounded-2xl text-center"><p class="text-2xl font-bold text-yellow-400" id="total">3</p><p class="text-xs text-gray-400">تجار</p></div>
<div class="bg-zinc-900 p-4 rounded-2xl text-center"><p class="text-2xl font-bold text-green-400">2</p><p class="text-xs text-gray-400">نشط</p></div>
<div class="bg-zinc-900 p-4 rounded-2xl text-center"><p class="text-2xl font-bold text-red-400" id="blocked">1</p><p class="text-xs text-gray-400">محظور</p></div>
</div>
<div class="bg-zinc-900 rounded-2xl p-4">
<h3 class="font-bold text-yellow-400 mb-3">➕ إضافة تاجر جديد</h3>
<div class="grid grid-cols-2 gap-3">
<input id="mName" placeholder="اسم المحل" class="p-3 rounded-xl bg-black border border-zinc-700">
<input id="mPhone" placeholder="واتساب 2126..." class="p-3 rounded-xl bg-black border border-zinc-700">
<input id="mArea" placeholder="المكان طابق 1 محل 45" class="p-3 rounded-xl bg-black border border-zinc-700">
<input id="mPin" placeholder="قن 1111" class="p-3 rounded-xl bg-black border border-zinc-700">
</div>
<button onclick="addMerchant()" class="w-full mt-3 bg-yellow-400 text-black py-3 rounded-xl font-bold">إضافة</button>
</div>
<div class="bg-zinc-900 rounded-2xl p-4">
<h3 class="font-bold mb-3">📋 قائمة التجار</h3>
<div id="merchants"></div>
</div>
</div>
</div>
<script>
let merchants = [
{id:"1",name:"محل أمين للهواتف",phone:"212661234567",area:"طابق 1 - محل 45",status:"نشط",clicks:890,vip:true},
{id:"2",name:"محل حمزة",phone:"212662345678",area:"طابق 2 - محل 12",status:"نشط",clicks:654,vip:false},
{id:"3",name:"محل زكرياء",phone:"212663456789",area:"طابق 2 - محل 18",status:"محظور",clicks:120,vip:false},
];
function login(){
if(document.getElementById('pin').value==="ADM999"){
document.getElementById('login').classList.add('hidden');
document.getElementById('dashboard').classList.remove('hidden');
render();
}else alert("قن خاطئ - جرب ADM999");
}
function render(){
document.getElementById('merchants').innerHTML = merchants.map(m=>`
<div class="flex justify-between items-center p-3 bg-black rounded-xl mb-2 border ${m.status==='محظور'?'border-red-500':'border-zinc-800'}">
<div>
<p class="font-bold">${m.name} ${m.vip?'⭐':''}</p>
<p class="text-xs text-gray-400">${m.area} - ${m.phone} - ${m.clicks} زيارة</p>
<span class="text-xs ${m.status==='محظور'?'bg-red-500':'bg-green-500'} px-2 py-0.5 rounded-full">${m.status}</span>
</div>
<div class="flex gap-2">
<button onclick="toggleBlock('${m.id}')" class="px-3 py-1 rounded-full text-xs ${m.status==='محظور'?'bg-green-600':'bg-red-600'}">${m.status==='محظور'?'فك الحظر':'حظر'}</button>
<button onclick="deleteM('${m.id}')" class="px-3 py-1 rounded-full text-xs bg-zinc-700">حذف</button>
</div>
</div>`).join('');
document.getElementById('total').innerText = merchants.length;
document.getElementById('blocked').innerText = merchants.filter(m=>m.status==='محظور').length;
}
function toggleBlock(id){
const m=merchants.find(x=>x.id===id);
m.status = m.status==='محظور'?'نشط':'محظور';
render();
alert(m.status==='نشط'?'✅ تم فك الحظر':'🚫 تم الحظر');
}
function deleteM(id){
if(confirm('متأكد؟')){ merchants=merchants.filter(m=>m.id!==id); render(); }
}
function addMerchant(){
const name=document.getElementById('mName').value;
if(!name) return alert('دخل اسم المحل');
merchants.push({id:Date.now().toString(),name,phone:document.getElementById('mPhone').value,area:document.getElementById('mArea').value,status:'نشط',clicks:0,vip:false});
render();
document.getElementById('mName').value=''; document.getElementById('mPhone').value=''; document.getElementById('mArea').value='';
}
</script>
</body>
</html>
